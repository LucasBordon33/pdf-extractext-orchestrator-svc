# CI del microservicio 1 (Orquestador)
name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, tipado y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instalar dependencias (lockfile)
        run: uv sync --locked --all-extras

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (tipado estático)
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest
