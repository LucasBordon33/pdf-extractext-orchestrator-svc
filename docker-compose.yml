services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.localhost`)"
      - "traefik.http.routers.orchestrator.entrypoints=web"
      - "traefik.http.routers.orchestrator.service=orchestrator"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"

networks:
  traefik-net:
    external: true
    name: traefik-net